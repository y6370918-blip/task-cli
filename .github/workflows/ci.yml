name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: task_test_user
          POSTGRES_PASSWORD: task_test_password
          POSTGRES_DB: task_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd
          "pg_isready -U task_test_user -d task_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: >-
        postgresql+psycopg2://task_test_user:task_test_password@localhost:5432/task_test
      TEST_POSTGRES_URL: >-
        postgresql+psycopg2://task_test_user:task_test_password@localhost:5432/task_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Upgrade empty PostgreSQL database
        run: python -m alembic upgrade head

      - name: Verify PostgreSQL migration head
        run: python -m alembic current --check-heads

      - name: Check models and migrations are in sync
        run: python -m alembic check

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: python -m mypy

      - name: pytest
        run: python -m pytest -q

  frontend-checks:
    # 独立运行，不依赖后端 Job。
    # 本轮前端测试模拟了请求，不需要 PostgreSQL 或真实 API Key。
    runs-on: ubuntu-latest

    defaults:
      run:
        # 只影响本 Job 中的 run 命令。
        # 不影响 uses 的配置路径。
        working-directory: frontend

    steps:
      # 每个 Job 都有独立环境，需要各自检出仓库。
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # 先与本地已经验证通过的版本保持一致。
          # 后续升级 Node 时，应同步更新并重新验证。
          node-version: "22.18.0"

          # 缓存 npm 下载内容，不代表跳过依赖安装。
          cache: npm

          # uses 不受上面的 working-directory 影响，
          # 因此这里仍然从仓库根目录填写路径。
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        # 按锁文件安装。
        # package.json 与锁文件不一致时失败，不自动修改锁文件。
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests
        # 当前 test 脚本是 vitest run，执行完会退出。
        # CI 中不能使用持续等待文件修改的 watch 模式。
        run: npm run test

      - name: Frontend build
        # 保留 TypeScript 检查和生产构建。
        # Vitest 测试通过不能替代这一步。
        run: npm run build
