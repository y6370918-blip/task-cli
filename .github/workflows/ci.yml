name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: >
          ruff check
          src/task_cli/exceptions.py
          src/task_cli/schemas.py
          src/task_cli/services.py
          src/task_cli/routers/tasks.py
          tests/test_api.py
          tests/test_services.py

      - name: Ruff format check
        run: >
          ruff format --check
          src/task_cli/exceptions.py
          src/task_cli/schemas.py
          src/task_cli/services.py
          src/task_cli/routers/tasks.py
          tests/test_api.py
          tests/test_services.py

      - name: mypy
        run: python -m mypy

      - name: pytest
        run: python -m pytest -q
