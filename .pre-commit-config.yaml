repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check
        language: system
        types: [python]

      - id: ruff-format-check
        name: Ruff format check
        entry: ruff format --check
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest
        name: pytest
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
