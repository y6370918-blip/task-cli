services:
  db:
    image: postgres:16
    container_name: task-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-task_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-task_db}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .

    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-task_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-task_db}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-30}
      DEEPSEEK_MAX_RETRIES: ${DEEPSEEK_MAX_RETRIES:-2}

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8000:8000"

    command:
      - sh
      - -c
      - >
        python -m alembic upgrade head &&
        exec uvicorn task_cli.api:app --host 0.0.0.0 --port 8000

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      # 使用前端目录作为构建上下文。
      # 因此读取 frontend/Dockerfile 和 frontend/.dockerignore。
      context: ./frontend

      args:
        # 提供给 Dockerfile 中的 ARG。
        # 这是公开的请求前缀，不是密钥。
        VITE_API_BASE_URL: /api

    ports:
      # 宿主机地址 : 宿主机端口 : 容器端口。
      # 仅绑定本机，不主动向局域网或公网开放前端。
      - "127.0.0.1:8080:8080"

    depends_on:
      api:
        # 等后端健康检查通过，再启动前端。
        # 只控制启动顺序，不保证后端以后永远可用。
        condition: service_healthy

    healthcheck:
      # 只检查 Nginx 能否提供页面入口。
      # 后端是否就绪，另外通过 /api/health/ready 验证。
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/index.html
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
