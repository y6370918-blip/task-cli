server {
    # 与前端 Dockerfile 中的 EXPOSE 8080 一致。
    listen 8080;

    # 配合 default.conf 中的这个唯一站点接收请求。
    server_name _;

    # Dockerfile 会把 dist 内容复制到这里。
    root /usr/share/nginx/html;
    index index.html;

    # 不在响应中显示 Nginx 的具体版本。
    server_tokens off;

    location /api/ {
        # api 是 Compose 服务名，由容器网络解析。
        #
        # 注意末尾的 /：
        # /api/tasks/ 会被转发成 /tasks/，
        # 而不是把 /api/tasks/ 原样交给 FastAPI。
        proxy_pass http://api:8000/;

        proxy_http_version 1.1;

        # 保留浏览器原始 Host，包括 localhost:8080 中的端口。
        proxy_set_header Host $http_host;

        # 本阶段 Nginx 是直接入口。
        # 覆盖客户端可能自行提供的转发头。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 与上游建立连接的等待时间。
        proxy_connect_timeout 5s;

        # AI 接口可能等待模型响应，不能照搬很短的等待时间。
        # 这是两次读取上游数据之间的超时，不是请求总时限。
        # 300 秒也不能保证任意多轮 AI 请求都能完成。
        proxy_read_timeout 300s;

        # 不在代理层自动把失败请求转交其他上游重试。
        # 避免为写操作额外引入不明确的重复执行行为。
        proxy_next_upstream off;

        # 保留后端返回的错误响应。
        # 不能把 API 的 401、404、503 替换成前端页面。
        proxy_intercept_errors off;
    }

    location /assets/ {
        # 构建后的 JS、CSS 在这里。
        # 文件不存在就返回 404，不能返回 index.html。
        try_files $uri =404;
    }

    location / {
        # 先寻找真实文件或目录。
        # 找不到时返回应用入口，支持前端页面路径刷新。
        #
        # /api/ 请求会进入上面的专用 location，
        # 不会使用这里的 index.html 回退。
        try_files $uri $uri/ /index.html;
    }
}