[build-system]
requires = [
    "setuptools>=61"
]
build-backend = "setuptools.build_meta"

[project]
name = "task-cli"
version = "0.1.0"
description = "A FastAPI task management API with an AI assistant"
requires-python = ">=3.12"

dependencies = [
    "alembic",
    "pydantic[email]",
    "python-dotenv",
    "sqlalchemy",
    "fastapi",
    "uvicorn",
    "psycopg2-binary",
    "passlib[bcrypt]",
    "bcrypt==4.0.1",
    "python-jose[cryptography]",
    "python-multipart",
    "openai",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
]


[tool.setuptools.packages.find]
where = [
    "src"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/task_cli/routers/*.py" = ["B008"]
"src/task_cli/auth_dependencies.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"

files = [
    "src/task_cli/exceptions.py",
    "src/task_cli/schemas.py",
    "src/task_cli/services.py",
    "src/task_cli/routers/tasks.py",
]

disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
show_error_codes = true
pretty = true
follow_imports = "silent"
