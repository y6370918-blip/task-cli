[build-system]
requires = [
    "setuptools>=61"
]
build-backend = "setuptools.build_meta"

[project]
name = "task-cli"
version = "0.1.0"
description = "A simple task management CLI application"

requires-python = ">=3.12"

dependencies = [
    "pydantic[email]",
    "python-dotenv",
    "sqlalchemy",
    "fastapi",
    "uvicorn",
    "psycopg2-binary",
    "passlib[bcrypt]",
    "bcrypt==4.0.1",
    "python-jose[cryptography]",
    "python-multipart",
    "openai",
]
[project.scripts]
task = "task_cli.main:main"

[tool.setuptools.packages.find]
where = [
    "src"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
